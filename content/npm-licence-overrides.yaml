# content/npm-licence-overrides.yaml: npm licenses read by hand (open-world-3d T2(c), AC9, D-831). A package in the
# apps/web production closure without `license` in package-lock.json carries here the license from its LICENSE, the sha256 of
# that file in node_modules (if the package changes, the hash stops matching and the test fails) and the date of the reading.
overrides:
  webgl-constants@1.1.1:
    license: MIT
    license_file_sha256: "0969fa65680b694452c2c65981df14af5c192da24f2b1f87bdd51d8ed24efcfa"
    verified: 2026-10-28
