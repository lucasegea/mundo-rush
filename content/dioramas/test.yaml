# content/dioramas/test.yaml: test map (03 §6.4.3, §4.2.1) in the mockup format (plan estetica-c M5,
# D-207): height-based terrain with hills at the edge, roads as catmull-rom curves with width, the pond as a water
# polygon (sinks the terrain and is not walkable), detail scattered by zones, props with instances and two neighbors of
# Region 1 plus Harlan. Migrated from the M1 tile format without changing which cells can be walked: the old grid
# was saved as a fixture (apps/web/test/fixtures/test-grid-tiles-43c2b48.json) and a test compares it cell by cell.
id: test
bounds: { minX: -16, maxX: 16, minZ: -12, maxZ: 12 }
spawn: [0.5, 0, 3]
# 160 m skirt (D-208: the farthest zoom does not see the edge), hills up to 5.5 m and the brush seed.
terreno: { extension: 160, lomas: 5.5, semilla: 11 }
caminos:
  # The valley road from north to south and the one crossing it from west to east (2 m wide); they stick out slightly past the limits
  # to tuck in between the hills.
  - { puntos: [[0, -14], [0, -6], [0, 4], [0, 14]], ancho: 2 }
  - { puntos: [[-18, 1], [-8, 1], [8, 1], [18, 1]], ancho: 2 }
  # The cobbled little square next to the spawn.
  - { puntos: [[-2.5, 2], [-2.5, 6]], ancho: 3, superficie: empedrado }
agua:
  # The pond: used to be 4 tiles plus a no_caminable polygon; now the water itself blocks the grid.
  - { poligono: [[6, -8], [10, -8], [10, -4], [6, -4]] }
detalle:
  - { tipo: flores, centro: [-12, -10], radio: 3, cantidad: 5 }
  - { tipo: flores, centro: [6, -10.5], radio: 2.5, cantidad: 4 }
  - { tipo: flores, centro: [-6, -5], radio: 3, cantidad: 4 }
  - { tipo: flores, centro: [13, -2], radio: 3, cantidad: 4 }
  - { tipo: flores, centro: [-9, 4], radio: 2.5, cantidad: 4 }
  - { tipo: flores, centro: [13, 9], radio: 2.5, cantidad: 4 }
  - { tipo: flores, centro: [-9, 9.5], radio: 2.5, cantidad: 5 }
  - { tipo: matas, centro: [-14, -4], radio: 3, cantidad: 5 }
  - { tipo: matas, centro: [-6, -10], radio: 2.5, cantidad: 3 }
  - { tipo: matas, centro: [9, -11], radio: 2, cantidad: 3 }
  - { tipo: matas, centro: [-7, 6.5], radio: 3, cantidad: 5 }
  - { tipo: matas, centro: [5, 7.5], radio: 2.5, cantidad: 3 }
  - { tipo: matas, centro: [-14, 4], radio: 2, cantidad: 3 }
  - { tipo: piedritas, centro: [-10, -2.5], radio: 3, cantidad: 5 }
  - { tipo: piedritas, centro: [-7, -9], radio: 2.5, cantidad: 4 }
  - { tipo: piedritas, centro: [11.5, -6], radio: 2, cantidad: 4 }
  - { tipo: piedritas, centro: [14.5, -4], radio: 1.5, cantidad: 4 }
  - { tipo: piedritas, centro: [-11, 3], radio: 1.5, cantidad: 3 }
  - { tipo: piedritas, centro: [-13, 10.5], radio: 1.5, cantidad: 3 }
  - { tipo: piedritas, centro: [7, 11], radio: 1.5, cantidad: 2 }
props:
  - { asset: codigo/casa, pos: [-9, 0, -7], tam: [4, 3, 3] }
  - { asset: codigo/galpon, pos: [11, 0, 7], tam: [5, 2.5, 3] }
  # Four identical bales: a single instanced mesh. The last two touch only at the corner: the character does not
  # get squeezed between them (F2 A1).
  - asset: codigo/caja
    tam: [1, 1, 1]
    instancias:
      - { pos: [4.5, 0, 4.5] }
      - { pos: [5.5, 0, 4.5] }
      - { pos: [-8.5, 0, 5.5] }
      - { pos: [-7.5, 0, 6.5] }
  - { asset: codigo/cerco, pos: [-12, 0, 0.5], tam: [0.2, 1, 9] }
  # Trees and pines as instances (plan estetica-c M1 item 11): `tam` is the trunk footprint (blocks the grid) and the
  # height; none cuts a road or the access to an NPC.
  - asset: codigo/arbol
    tam: [0.6, 4.5, 0.6]
    instancias:
      - { pos: [-14, 0, -10] }
      - { pos: [-4.5, 0, -9.5], tam: [0.6, 4.2, 0.6] }
      - { pos: [11, 0, -10.5], tam: [0.6, 4.6, 0.6] }
      - { pos: [13.5, 0, -2.5], tam: [0.6, 4.4, 0.6] }
      - { pos: [-14.5, 0, -1.5], tam: [0.6, 4.3, 0.6] }
      - { pos: [-6.5, 0, 10.5] }
      - { pos: [3.5, 0, 10], tam: [0.6, 4.4, 0.6] }
  - asset: codigo/pino
    tam: [0.6, 5.0, 0.6]
    instancias:
      - { pos: [3, 0, -10], tam: [0.6, 4.8, 0.6] }
      - { pos: [13.5, 0, -8.5], tam: [0.6, 5.2, 0.6] }
      - { pos: [-9.5, 0, 3.5], tam: [0.6, 4.6, 0.6] }
      - { pos: [-14.5, 0, 9.5] }
      - { pos: [14.5, 0, 10.5] }
  # Plan estetica-c M2 (D-207): two CC0 props repainted by scripts/assets/optimize.ts (content/assets-registry.yaml).
  # `tam` is the footprint that blocks the grid and the box the model fits into with uniform scale, resting on the ground.
  - { asset: modelo/quaternius-farm-buildings/gallinero, pos: [-12.5, 0, 8], tam: [3, 2.3, 2.7] }
  - { asset: modelo/quaternius-farm-buildings/cerco, pos: [-12.5, 0, 10.6], tam: [5.9, 1.1, 0.2] }
npcs:
  - { id: NPC-NELL, spawn: [-3, 0, 7], radio_interaccion: 3.0 }
  - { id: NPC-INES, spawn: [6, 0, -1.5], radio_interaccion: 3.0 }
  # A2 (ADR-027): Harlan on his porch next to the shed, for the M9.1 meter-based conversation.
  - { id: NPC-HARLAN, spawn: [7.5, 0, 6], radio_interaccion: 3.0 }
