# content/dioramas/test.yaml: mapa de prueba (03 §6.4.3, §4.2.1) en el formato de la maqueta (plan estetica-c M5,
# D-207): terreno por alturas con lomas en el borde, caminos por curvas catmull-rom con ancho, el estanque como polígono
# de agua (hunde el terreno y no es caminable), detalle sembrado por zonas, props con instancias y dos vecinos de la
# Región 1 más Harlan. Migrado desde el formato de tiles de M1 sin cambiar qué celdas se pueden caminar: la grilla vieja
# quedó guardada como fixture (apps/web/test/fixtures/test-grid-tiles-43c2b48.json) y un test la compara celda por celda.
id: test
bounds: { minX: -16, maxX: 16, minZ: -12, maxZ: 12 }
spawn: [0.5, 0, 3]
# Falda de 160 m (D-208: el zoom más lejano no ve el borde), lomas de hasta 5,5 m y la semilla del pincel.
terreno: { extension: 160, lomas: 5.5, semilla: 11 }
caminos:
  # El camino del valle de norte a sur y el que lo cruza de oeste a este (2 m de ancho); salen apenas de los límites
  # para meterse entre las lomas.
  - { puntos: [[0, -14], [0, -6], [0, 4], [0, 14]], ancho: 2 }
  - { puntos: [[-18, 1], [-8, 1], [8, 1], [18, 1]], ancho: 2 }
  # La placita empedrada junto al spawn.
  - { puntos: [[-2.5, 2], [-2.5, 6]], ancho: 3, superficie: empedrado }
agua:
  # El estanque: antes tiles 4 más un polígono no_caminable; ahora el agua misma bloquea la grilla.
  - { poligono: [[6, -8], [10, -8], [10, -4], [6, -4]] }
detalle:
  - { tipo: flores, centro: [-12, -10], radio: 3, cantidad: 5 }
  - { tipo: flores, centro: [6, -10.5], radio: 2.5, cantidad: 4 }
  - { tipo: flores, centro: [-6, -5], radio: 3, cantidad: 4 }
  - { tipo: flores, centro: [13, -2], radio: 3, cantidad: 4 }
  - { tipo: flores, centro: [-9, 4], radio: 2.5, cantidad: 4 }
  - { tipo: flores, centro: [13, 9], radio: 2.5, cantidad: 4 }
  - { tipo: flores, centro: [-9, 9.5], radio: 2.5, cantidad: 5 }
  - { tipo: matas, centro: [-14, -4], radio: 3, cantidad: 5 }
  - { tipo: matas, centro: [-6, -10], radio: 2.5, cantidad: 3 }
  - { tipo: matas, centro: [9, -11], radio: 2, cantidad: 3 }
  - { tipo: matas, centro: [-7, 6.5], radio: 3, cantidad: 5 }
  - { tipo: matas, centro: [5, 7.5], radio: 2.5, cantidad: 3 }
  - { tipo: matas, centro: [-14, 4], radio: 2, cantidad: 3 }
  - { tipo: piedritas, centro: [-10, -2.5], radio: 3, cantidad: 5 }
  - { tipo: piedritas, centro: [-7, -9], radio: 2.5, cantidad: 4 }
  - { tipo: piedritas, centro: [11.5, -6], radio: 2, cantidad: 4 }
  - { tipo: piedritas, centro: [14.5, -4], radio: 1.5, cantidad: 4 }
  - { tipo: piedritas, centro: [-11, 3], radio: 1.5, cantidad: 3 }
  - { tipo: piedritas, centro: [-13, 10.5], radio: 1.5, cantidad: 3 }
  - { tipo: piedritas, centro: [7, 11], radio: 1.5, cantidad: 2 }
props:
  - { asset: codigo/casa, pos: [-9, 0, -7], tam: [4, 3, 3] }
  - { asset: codigo/galpon, pos: [11, 0, 7], tam: [5, 2.5, 3] }
  # Cuatro fardos iguales: una sola malla instanciada. Los dos últimos se tocan solo por la esquina: el personaje no
  # se aprieta entre ellos (F2 A1).
  - asset: codigo/caja
    tam: [1, 1, 1]
    instancias:
      - { pos: [4.5, 0, 4.5] }
      - { pos: [5.5, 0, 4.5] }
      - { pos: [-8.5, 0, 5.5] }
      - { pos: [-7.5, 0, 6.5] }
  - { asset: codigo/cerco, pos: [-12, 0, 0.5], tam: [0.2, 1, 9] }
  # Árboles y pinos por instancias (plan estetica-c M1 ítem 11): `tam` es la huella del tronco (bloquea la grilla) y el
  # alto; ninguno corta un camino ni el acceso a un NPC.
  - asset: codigo/arbol
    tam: [0.6, 4.5, 0.6]
    instancias:
      - { pos: [-14, 0, -10] }
      - { pos: [-4.5, 0, -9.5], tam: [0.6, 4.2, 0.6] }
      - { pos: [11, 0, -10.5], tam: [0.6, 4.6, 0.6] }
      - { pos: [13.5, 0, -2.5], tam: [0.6, 4.4, 0.6] }
      - { pos: [-14.5, 0, -1.5], tam: [0.6, 4.3, 0.6] }
      - { pos: [-6.5, 0, 10.5] }
      - { pos: [3.5, 0, 10], tam: [0.6, 4.4, 0.6] }
  - asset: codigo/pino
    tam: [0.6, 5.0, 0.6]
    instancias:
      - { pos: [3, 0, -10], tam: [0.6, 4.8, 0.6] }
      - { pos: [13.5, 0, -8.5], tam: [0.6, 5.2, 0.6] }
      - { pos: [-9.5, 0, 3.5], tam: [0.6, 4.6, 0.6] }
      - { pos: [-14.5, 0, 9.5] }
      - { pos: [14.5, 0, 10.5] }
  # Plan estetica-c M2 (D-207): dos props CC0 repintados por scripts/assets/optimize.ts (content/assets-registry.yaml).
  # `tam` es la huella que bloquea la grilla y la caja donde el modelo entra con escala uniforme, apoyado en el suelo.
  - { asset: modelo/quaternius-farm-buildings/gallinero, pos: [-12.5, 0, 8], tam: [3, 2.3, 2.7] }
  - { asset: modelo/quaternius-farm-buildings/cerco, pos: [-12.5, 0, 10.6], tam: [5.9, 1.1, 0.2] }
npcs:
  - { id: NPC-NELL, spawn: [-3, 0, 7], radio_interaccion: 3.0 }
  - { id: NPC-INES, spawn: [6, 0, -1.5], radio_interaccion: 3.0 }
  # A2 (ADR-027): Harlan en su porche junto al galpón, para la conversación por medidores de M9.1.
  - { id: NPC-HARLAN, spawn: [7.5, 0, 6], radio_interaccion: 3.0 }
