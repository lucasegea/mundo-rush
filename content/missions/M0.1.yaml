escenas:
  - escena_id: M0.1-E1
    npc: NPC-INES
    lugar: campos.parada
    hora: amanecer
    situacion: "Inés, capataz de la cuadrilla, recibe al trabajador nuevo en la parada del colectivo con su lista; quiere anotarlo y darle la llave del albergue y el mapa. La avioneta pasa lejos sobre el maíz."
    necesidad_npc: "Saber quién sos para su lista."
    banda: A0
    andamiaje_npc:
      - "I'm Inés. You…? (se señala, te señala)"
      - "Hello… I'm…? (deja la frase abierta)"
      - "Lumi pista nivel 3 (LUMI-M0.1-P3)"
    vocabulario_nivel: [hello, hi, welcome, "I'm", you, name, nice, meet, thank you, key, map, plane, field, crew, bye]
    max_palabras_nuevas_por_turno: 1
    hechos_escena: [SAB-AVIONETA]
    apertura_guionada:
      - { quien: NPC-KOFI, en: "Kestrel Valley! Last stop!", es_glosa: "¡Kestrel Valley! ¡Última parada!", acotacion: "ambiental, baja tu mochila del colectivo; sin respuesta" }
      - { quien: NPC-INES, en: "Hello! Welcome to Kestrel Valley.", es_glosa: "¡Hola! Bienvenido/a a Kestrel Valley.", acotacion: "saluda" }
      - { quien: NPC-INES, en: "I'm Inés.", es_glosa: "Soy Inés.", acotacion: "se señala" }
      - { quien: NPC-INES, en: "And you?", es_glosa: "¿Y vos?", acotacion: "te señala" }
    ramas:
      - { si: "dice saludo + nombre (\"Hello! I'm Nico.\") o \"My name is Nico\"", quien: NPC-INES, npc: "Nico! Nice to meet you, Nico!", tipo: ejemplo_ia, nota: "criterio cumplido → beat 5" }
      - { si: "dice solo el nombre (\"Nico.\")", quien: NPC-INES, npc: "Nico! Hello, Nico! I'm Inés. You are… Nico. Yes!", tipo: guionada, nota: "modela I'm sin pedir repetición; criterio de nombre cumplido. Saludo: si agrega Hello en cualquier momento, cumplido; si no, Inés dice Hello! otra vez con la mano levantada y espera." }
      - { si: "dice solo \"Hello\"", quien: NPC-INES, npc: "Hello! I'm Inés. You are…?", tipo: guionada, nota: "se señala; espera" }
      - { si: "pasa el turno", quien: NPC-INES, npc: "I'm Inés. You…?", tipo: guionada, nota: "andamiaje 1. Segundo pase: Hello… I'm…? Tercer pase: Lumi pista nivel 3.", lumi: LUMI-M0.1-P3 }
      - { si: "habla en español (\"Hola, soy Nico\")", quien: NPC-INES, npc: "¡Hola! In English: Hello!", tipo: guionada, lumi: LUMI-M0.1-L1, nota: "¡Hola! es su única palabra en español del capítulo (D-184); espera" }
      - { si: "dice \"Nice to meet you\" (en cualquier momento)", quien: NPC-INES, npc: "Nice to meet you too!", tipo: guionada, nota: "poción ámbar extra" }
      - { si: "pregunta \"Why?\" tras la avioneta", quien: NPC-INES, npc: "For the bugs. On the corn.", tipo: ejemplo_ia }
      - { si: "pregunta \"Is it bad?\" tras la avioneta", quien: NPC-INES, npc: "Ask Grace. The nurse.", tipo: guionada, nota: "rail de salud; sin más" }
      - { si: "dice algo fuera de tema", quien: NPC-INES, npc: "Ha! Okay. And your name?", tipo: guionada }
    lineas_guionadas:
      - { quien: NPC-INES, en: "That plane? It sprays the fields.", es_glosa: "¿Esa avioneta? Fumiga los campos.", acotacion: "beat 5 (saber), tras el nombre: motor lejano; Inés mira al cielo" }
    criterios_exito:
      - { id: C1, texto: "El jugador produce un saludo (hello/hi/good morning/hey)." }
      - { id: C2, texto: "El jugador produce su nombre de juego (con o sin \"I'm\"/\"My name is\")." }
    errores_de_objetivo: []
    cierre_guionado:
      - { quien: NPC-INES, en: "Nice to meet you, [nombre]!", es_glosa: "¡Encantada, [nombre]!", audio: al_vuelo }
      - { quien: NPC-INES, en: "Here's your key.", es_glosa: "Acá tenés tu llave." }
      - { quien: NPC-INES, en: "And a map.", es_glosa: "Y un mapa." }
      - { quien: NPC-INES, en: "Maya lives at the Crossing.", es_glosa: "Maya vive en el Cruce." }
      - { quien: NPC-INES, en: "Bye!", es_glosa: "¡Chau!" }
      - { quien: LUMI, plantilla: LUMI-M0.1-CIERRE }
