# M0.1 · Hola, Inés (02 §4.4; esquema 02 §6.2.2-§6.2.3). Líneas [GUIONADA] tal cual 02; las [EJEMPLO IA] van como
# ramas tipo ejemplo_ia (muestra de estilo, no texto fijo; 02 §0.4). Glosas es_glosa: solo diseño, nunca al cliente.
