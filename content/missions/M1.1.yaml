  piezas_utiles: ["Good morning", "I'm from…", "How are you?"]
beats:
  - "Nell en el porche, con una taza; saluda con la mano."
  - "Nell reconoce la presentación de Maya; se presenta."
  - "Nell pregunta tu nombre (re-surface HAB-VINC-1: si ya lo sabe por Maya, lo dice ella y pide confirmar)."
  - "Nell pregunta de dónde sos."
  - "Nell pregunta cómo estás; espacio para devolver la pregunta."
  - "Nell señala la escuela: una sola aula (saber). Momento cultural opcional (mate)."
  - "Nell te da la llave del tablero; cruzan hasta el árbol; el primer papel."
  - "Cierre y destilación."
escenas:
  - escena_id: M1.1-E1
    npc: NPC-NELL
    lugar: cruce.porche_nell
    hora: manana
    situacion: "Nell, maestra jubilada, está en su porche junto a la escuela cerrada, con una taza. Maya le habló del trabajador nuevo. Quiere saber quién es, de dónde viene y si se va a quedar a ayudar; al final le da la llave del tablero del Cruce."
    necesidad_npc: "Saber quién es el nuevo que mandó Maya y si se va a quedar a ayudar."
    banda: A1
    andamiaje_npc:
      - "I'm from the valley. You? (modela)"
      - "Argentina? Brazil? Another place? (cualquier respuesta vale)"
    vocabulario_nivel: [good morning, teacher, school, name, from, where, how, fine, good, tired, happy, board, key, neighbor, welcome, mate, room]
    max_palabras_nuevas_por_turno: 1
    hechos_escena: [SAB-ESCUELA-RURAL, SAB-MATE]
    apertura_guionada:
      - { quien: NPC-NELL, en: "Good morning!", es_glosa: "¡Buen día!" }
      - { quien: NPC-NELL, en: "You're the new worker!", es_glosa: "¡Sos el/la nuevo/a!" }
      - { quien: NPC-NELL, en: "Maya told me.", es_glosa: "Maya me contó." }
      - { quien: NPC-NELL, en: "I'm Nell. I was the teacher here.", es_glosa: "Soy Nell. Era la maestra acá." }
    ramas:
      - { si: "dice \"Good morning! I'm Nico. Nice to meet you.\"", quien: NPC-NELL, npc: "Nice to meet you, Nico! Where are you from?", tipo: ejemplo_ia }
      - { si: "dice \"I'm from Argentina.\"", quien: NPC-NELL, npc: "Argentina? Far away! How are you today?", tipo: guionada }
      - { si: "dice \"I from Argentina.\" (error local; cuenta como error de objetivo solo si se repite)", quien: NPC-NELL, npc: "Oh, you're from Argentina! Far away!", tipo: guionada, nota: "recast natural; no se señala; Lumi anota I'm from. Si lo repite en otro turno, Lumi escalón 2.", lumi: LUMI-SEN-2-01 }
      - { si: "nombra otro lugar (\"Mars.\")", quien: NPC-NELL, npc: "Mars? Ha! A long trip!", tipo: guionada, nota: "vale" }
      - { si: "ante How are you today?, dice \"I'm fine, thanks. And you?\"", quien: NPC-NELL, npc: "I'm good! But the Crossing is so quiet.", tipo: guionada, nota: "criterio opcional cumplido" }
      - { si: "ante How are you today?, dice \"Fine.\"", quien: NPC-NELL, npc: "Fine! Good!", tipo: guionada, nota: "pausa breve: deja lugar para And you?; si no llega, sigue" }
      - { si: "ante How are you today?, dice \"I'm tired.\"", quien: NPC-NELL, npc: "Tired? The fields are hard work!", tipo: guionada }
      - { si: "pregunta \"Is it closed?\" por la escuela", quien: NPC-NELL, npc: "Yes. For many years. Too quiet now.", tipo: guionada }
      - { si: "menciona Argentina o el mate (rama cultural, una sola vez, D-066)", quien: NPC-NELL, npc: "Argentina! Mate, right? A tea in a gourd!", tipo: guionada, nota: "mira el mate que asoma de tu mochila" }
      - { si: "pasa el turno ante \"Where are you from?\"", quien: NPC-NELL, npc: "I'm from the valley. You?", tipo: guionada, nota: "modela; segundo pase: Argentina? Brazil? Another place?" }
      - { si: "pregunta a Nell (\"Are you from here?\")", quien: NPC-NELL, npc: "Yes! Born here. I know everybody!", tipo: guionada, nota: "poción ámbar por preguntar por el otro" }
      - { si: "pregunta por su silla", quien: NPC-NELL, npc: "It's my chair. It goes where I need.", tipo: guionada, nota: "y sigue" }
    lineas_guionadas:
      - { quien: NPC-NELL, en: "That was our school.", es_glosa: "Esa era nuestra escuela.", acotacion: "saber, si el jugador no preguntó antes; señala la escuela" }
      - { quien: NPC-NELL, en: "One room, all the children.", es_glosa: "Una sola aula, todos los chicos." }
      - { quien: NPC-NELL, en: "One teacher. Me!", es_glosa: "Una maestra. ¡Yo!" }
    criterios_exito:
      - { id: C1, texto: "Saludo apropiado." }
      - { id: C2, texto: "Nombre (confirmación vale si Nell ya lo sabe).", habilidad: HAB-VINC-1 }
      - { id: C3, texto: "Un lugar de origen (cualquiera)." }
      - { id: C4, texto: "Responde How are you? y devuelve la pregunta.", opcional: true }
    errores_de_objetivo: ["I from (falta el verbo en I'm from)"]
    cierre_guionado:
      - { quien: NPC-NELL, en: "Here's the key to the board.", es_glosa: "Acá está la llave del tablero." }
      - { quien: NPC-NELL, en: "Write what the Crossing needs.", es_glosa: "Escribí lo que necesita el Cruce." }
      - { quien: NPC-NELL, en: "Ollie knows every mailbox.", es_glosa: "Ollie conoce todos los buzones." }
      - { quien: NPC-NELL, en: "Talk to him! Tell him Nell sent you.", es_glosa: "¡Hablá con él! Decile que te manda Nell.", acotacion: "cruzan hasta el árbol; Nell abre el vidrio; pinchan el papel" }
      - { quien: LUMI, plantilla: LUMI-M1.1-CIERRE }
    salida_si_no_converge:
      disparador: "la escena no converge"
      lineas:
        - { quien: NPC-NELL, en: "You know what? Maya likes you. That's enough! Here's the key.", es_glosa: "¿Sabés qué? Le caés bien a Maya. ¡Alcanza! Acá está la llave." }
      resultado: "Llave igual."
