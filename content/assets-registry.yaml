    fecha_acceso: 2026-10-13
    verificacion: [V1]
    estado: diferido
    razon: >-
      Más de 150 clips CC0 para Rig_Medium (sentarse, interactuar, levantar, herramientas). Solo en itch.io: la baja el
      operador para M3. Faltan hablar, asentir, negar, cargar caminando y dar (se resuelven por código o desde UAL).
    fuente_investigacion: investigación 2026-10-13, V1
  - id: kaykit-series-6
    nombre: KayKit Mystery Monthly Series 6 (The Farmers)
