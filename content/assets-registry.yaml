# content/assets-registry.yaml: registro de licencias de assets (03 §6.4.2, D-153; plan estetica-c M2, D-207).
# Todo archivo servido en apps/web/public/{models,textures,audio,sprites} tiene una fila en `assets`; validate:content
# falla si falta, si la licencia es no comercial o de uso personal, o si una fila con atribucion_requerida no está en
# content/creditos.yaml. `packs` cierra las tareas de verificación V1 a V5 de M2 (usado, descartado con la razón,
# diferido al operador o pendiente para un hito posterior). Fuente de todas las verificaciones: investigación de assets
# del 2026-10-13 (documento interno), con fuente y fecha de acceso por pack.
# `pintura` es la tabla del pack de material de origen a token de la paleta (@lg/art) que usa scripts/assets/optimize.ts.
# El decodificador meshopt de apps/web/public/decoders/ es código de three (MIT, igual que three), no un asset: no va acá.
packs:
  # ---------- usados en M2 ----------
  - id: quaternius-farm-buildings
    nombre: Quaternius Farm Buildings Pack (2018), GLB sueltos en poly.pizza
    autor: Quaternius
    licencia: CC0-1.0
    url: https://quaternius.com/packs/farmbuildings.html
    fecha_acceso: 2026-10-13
    verificacion: [V3]
    estado: usado
    razon: >-
      Cubre granero, gallinero, silo, molino y cercos sin texturas (color por material), CC0 en la página del pack y en
      cada modelo de poly.pizza (Licence "CC0 1.0", autor Quaternius). En poly.pizza están 10 de las 13 piezas (subidas
      el 2021-08-15: Barn, BigBarn, SmallBarn, OpenBarn, Silo, Silo_House, TowerWindmill, ChickenCoop, Fence x2); Well,
      WaterTower y Windmill solo están en FBX/OBJ en el Drive del pack, así que el pozo y el tanque de M2 quedan para
      cuando el pipeline lea FBX o el operador los exporte. Low-poly de aristas duras: cada pieza va con bisel registrado.
    fuente_investigacion: investigación 2026-10-13, V3 (Quaternius Farm Buildings Pack) y tabla de descargas
    pintura:
      White: muro
      LightRed: techo
      DarkRed: cumbrera
      Brown: madera
      RoofBlack: tinta-suave
      Grey: piedra
  # ---------- descartados ----------
  - id: quaternius-medieval-village-megakit
    nombre: Quaternius Medieval Village MegaKit (Standard)
    autor: Quaternius
    licencia: CC0-1.0
    url: https://quaternius.com/packs/medievalvillagemegakit.html
    fecha_acceso: 2026-10-13
    verificacion: [V3]
    estado: descartado
    razon: >-
      Texturas PBR de trim sheet (BaseColor, Normal, ORM) que el pipeline sin texturas pierde, y estética medieval
      europea que no es el rural moderno de la biblia. Sin granero ni pozo.
    fuente_investigacion: investigación 2026-10-13, V3 (Medieval Village MegaKit)
  - id: quaternius-stylized-nature-megakit
    nombre: Quaternius Stylized Nature MegaKit (Standard)
    autor: Quaternius
    licencia: CC0-1.0
    url: https://quaternius.com/packs/stylizednaturemegakit.html
    fecha_acceso: 2026-10-13
    verificacion: [V3]
    estado: descartado
    razon: >-
      Todo texturizado y los árboles y arbustos usan hojas como tarjetas con máscara alfa (alphaMode MASK): al quitar la
      textura quedan cuadrados verdes. Árboles y pinos ya son por código (M1); piedras y troncos se reconsideran solo si
      el operador quiere esas formas.
    fuente_investigacion: investigación 2026-10-13, V3 (Stylized Nature MegaKit)
  - id: mixamo
    nombre: Mixamo (Adobe)
    autor: Adobe
    licencia: Términos de Adobe Mixamo (no CC0)
    url: https://www.mixamo.com/
    fecha_acceso: 2026-10-13
    verificacion: [V4]
    estado: descartado
    razon: >-
      Adobe prohíbe redistribuir los archivos crudos de personaje y animación, y en un juego web el GLB queda
      descargable desde el navegador; además pide cuenta Adobe (no se baja por script). Quaternius UAL 1 y 2 (CC0)
      cubren lo mismo.
    fuente_investigacion: investigación 2026-10-13, V4 (Mixamo, FAQ citado desde Adobe Community)
  # ---------- diferidos al operador (login, compra o descarga por navegador) ----------
  - id: kaykit-adventurers
    nombre: KayKit Character Pack Adventurers 2.0 (Free)
    autor: Kay Lousberg
    licencia: CC0-1.0
    url: https://kaylousberg.itch.io/kaykit-adventurers
    fecha_acceso: 2026-10-13
    verificacion: [V1]
    estado: diferido
    razon: >-
      Cuerpos base chibi para M3 (esqueleto de destino recomendado Rig_Medium). La 2.0 solo está en itch.io (botón de
      "name your own price", no scriptable): la baja el operador. La 1.0 de GitHub se puede bajar por script pero no
      está verificado que sus huesos coincidan con Rig_Medium 2.0. Ropa de fantasía: se repinta y se viste con accesorios.
    fuente_investigacion: investigación 2026-10-13, V1
  - id: kaykit-character-animations
