# content/assets-registry.yaml: asset license registry (03 §6.4.2, D-153; plan estetica-c M2, D-207;
# D1 license policy of the open-world-3d plan, D-209 and D-831).
# Every file served from apps/web/public/{models,textures,audio,sprites} has a row in `assets`; validate:content
# fails if it is missing, if the license is not in the closed D1 list, if a row with atribucion_requerida is not in
# content/creditos.yaml, or if a software license lacks its archivo_licencia. Closed D1 list: CC0-1.0,
# CC-BY-3.0 and CC-BY-4.0 (with attribution in the credits), MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
# Zlib and OFL-1.1 (the software ones, with their text versioned in the repo). Everything else fails closed under any
# spelling: non-commercial, no-derivatives, share-alike (CC-BY-SA), GPL/LGPL/AGPL, "personal use", unknown license
# and unproven provenance. Each served row carries `sha256` (served bytes) and `procedencia`
# (refetched, derived, generated or edited), which scripts/content/provenance.test.ts recomputes; generated rows
# (ez-tree trees, MIT) carry `generador` instead of url_origen, fecha_descarga and sha256_original.
# `npm run assets:refetch` downloads and derives every row again and compares bytes. Nothing derived from third-party
# commercial games gets in (no extraction, ripping, reverse engineering or emulators): the AC10 denylist proves it
# (scripts/content/denylist.test.ts). npm licenses are verified separately, with content/npm-licence-overrides.yaml.
# `packs` closes the V1 to V5 verification tasks of M2 (used, discarded with the reason,
# deferred to the operator or pending for a later milestone). Source of all verifications: the reference research's research
# of 2026-10-13 (internal document), with source and access date per pack.
# `pintura` is the table from the pack's source material to a palette token (@lg/art) used by scripts/assets/optimize.ts.
# The meshopt decoder in apps/web/public/decoders/ is code (MIT): its row is in content/code-registry.yaml (D-831).
