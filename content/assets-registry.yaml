    verificacion: [V4]
    estado: diferido
    razon: >-
      Clips para retargetear en M3 (Idle_Talking_Loop, Sitting_Talking_Loop). El espejo de OpenGameArt trae huesos
      Rigify viejos; la versión actual con huesos renombrados está solo en itch.io: la baja el operador.
    fuente_investigacion: investigación 2026-10-13, V4
  - id: synty-polygon
    nombre: Synty POLYGON Farm, POLYGON Nature y Sidekick
    autor: Synty Studios
    licencia: EULA de compra única de Synty (pago)
    url: https://syntystore.com/pages/end-user-licence-agreement
    fecha_acceso: 2026-10-13
    verificacion: [V5]
    estado: diferido
    razon: >-
      No hace falta ahora: los packs CC0 alcanzan para M2 y M3. Queda como pregunta para el operador (Farm 49,99 USD,
      6 granjeros con rig y sin animaciones; zona gris del GLB descargable frente a la cláusula de source files; estilo
      facetado con texturas de atlas). Nada se compra sin su decisión.
    fuente_investigacion: investigación 2026-10-13, V5
  # ---------- pendientes (se bajan por script cuando un hito los use) ----------
  - id: quaternius-ultimate-animated-animals
    nombre: Quaternius Ultimate Animated Animal Pack
    autor: Quaternius
    licencia: CC0-1.0
    url: https://quaternius.com/packs/ultimateanimatedanimals.html
