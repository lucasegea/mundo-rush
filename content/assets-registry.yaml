# content/assets-registry.yaml: registro de licencias de assets (03 §6.4.2, D-153; plan estetica-c M2, D-207).
# Todo archivo servido en apps/web/public/{models,textures,audio,sprites} tiene una fila en `assets`; validate:content
# falla si falta, si la licencia no está en la lista permitida (CC0-1.0, o CC-BY-4.0 con atribución; todo lo demás,
# "uso personal" o "no comercial" en cualquier grafía incluido, se rechaza), o si una fila con atribucion_requerida no
# está en content/creditos.yaml. `packs` cierra las tareas de verificación V1 a V5 de M2 (usado, descartado con la razón,
# diferido al operador o pendiente para un hito posterior). Fuente de todas las verificaciones: investigación de assets
# del 2026-10-13 (documento interno), con fuente y fecha de acceso por pack.
# `pintura` es la tabla del pack de material de origen a token de la paleta (@lg/art) que usa scripts/assets/optimize.ts.
# El decodificador meshopt de apps/web/public/decoders/ es código (MIT): su fila está en content/code-registry.yaml (D-831).
packs:
  # ---------- usados en M2 ----------
  - id: quaternius-farm-buildings
    nombre: Quaternius Farm Buildings Pack (2018), GLB sueltos en poly.pizza
    autor: Quaternius
    licencia: CC0-1.0
    url: https://quaternius.com/packs/farmbuildings.html
    fecha_acceso: 2026-10-13
    verificacion: [V3]
    estado: usado
    razon: >-
      Cubre granero, gallinero, silo, molino y cercos sin texturas (color por material), CC0 en la página del pack y en
      cada modelo de poly.pizza (Licence "CC0 1.0", autor Quaternius). En poly.pizza están 10 de las 13 piezas (subidas
      el 2021-08-15: Barn, BigBarn, SmallBarn, OpenBarn, Silo, Silo_House, TowerWindmill, ChickenCoop, Fence x2); Well,
      WaterTower y Windmill solo están en FBX/OBJ en el Drive del pack, así que el pozo y el tanque de M2 quedan para
      cuando el pipeline lea FBX o el operador los exporte. Low-poly de aristas duras: cada pieza va con bisel registrado.
    fuente_investigacion: investigación 2026-10-13, V3 (Quaternius Farm Buildings Pack) y tabla de descargas
    pintura:
      White: muro
      LightRed: techo
      DarkRed: cumbrera
      Brown: madera
      RoofBlack: tinta-suave
      Grey: piedra
