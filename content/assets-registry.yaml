    fecha_acceso: 2026-10-13
    verificacion: [V1]
    estado: diferido
    razon: >-
      Los únicos granjeros de KayKit (dos personajes, mismo rig). Pregunta para el operador: si paga 19,99 USD; la
      licencia de uso sigue siendo CC0.
    fuente_investigacion: investigación 2026-10-13, V1 y preguntas para el operador
  - id: quaternius-ual-1
    nombre: Quaternius Universal Animation Library 1 (Standard)
    autor: Quaternius
    licencia: CC0-1.0
    url: https://quaternius.com/packs/universalanimationlibrary.html
