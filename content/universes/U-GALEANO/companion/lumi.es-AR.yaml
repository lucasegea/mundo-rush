# Minimal Lumi catalog for U-GALEANO (book-mode slice-1, M3).
# Only the generic signals (02 §2.7.2) that the catalog check requires (chequearCatalogoLumi): one signal of
# type `any` per step 2-5 covering A0 and A1. mision/saber null so as not to cross references with the dataset.
# M3/M4 SEAM: the universe's own catalog (signals by error type, mission templates) would be generated by
# LANG-FIT once the analyzer is real; in slice-1 the generic ones are enough for the compiler to measure.
idioma_l1: es-AR
plantillas:
  - id: LUMI-SEN-2-01
    funcion: senal
    escalon: 2
    modos: [accompanied, moreHelp]
    bandas: [A0, A1, A2, B1]
    tipo_error: [any]
    texto: "¿***{forma_jugador}***…?"
    slots: [forma_jugador]
    audio: al_vuelo
    mision: null
    saber: null
    nota: "sube el tono en la parte del error"
    estado: draft
  - id: LUMI-SEN-3-01
    funcion: senal
    escalon: 3
    modos: [accompanied, moreHelp]
    bandas: [A0, A1, A2, B1]
    tipo_error: [any]
    texto: "Mmm… mirá ***{foco_l2}***. ¿Cómo era?"
    slots: [foco_l2]
    audio: al_vuelo
    mision: null
    saber: null
    nota: null
    estado: draft
  - id: LUMI-SEN-4-01
    funcion: senal
    escalon: 4
    modos: [accompanied, moreHelp]
    bandas: [A0, A1, A2, B1]
    tipo_error: [any]
    texto: "{glosa_l1}… ***{forma_abierta}…***"
    slots: [glosa_l1, forma_abierta]
    audio: al_vuelo
    mision: null
    saber: null
    nota: "deja la frase abierta"
    estado: draft
  - id: LUMI-SEN-5-01
    funcion: senal
    escalon: 5
    modos: [accompanied, moreHelp]
    bandas: [A0, A1, A2, B1]
    tipo_error: [any]
    texto: "***{forma_correcta}*** Eso. Seguí, {npc} te escucha."
    slots: [forma_correcta, npc]
    audio: al_vuelo
    mision: null
    saber: null
    nota: null
    estado: draft
