# Inappropriate language (02 §3.2 S4-S5; 01 §2.17.1; 03 §7.7). At runtime: player input or NPC output with one
# of these terms → cut + safe line + safety_event (F4.2). As a content lint (aplica_a: todo) it guarantees
# that no line of the game has them. PROVISIONAL (the F13 review expands it). No ambiguous terms of the field
# (rapeseed, cock, forro, concha): a false positive cuts an innocent chat.
