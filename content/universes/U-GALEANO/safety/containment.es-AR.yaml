# Contención y línea segura (03 §7.7 puntos 3-5; GDD DP-38; D-112: mecanismo en F4.2, textos finales en F13).
# TODOS LOS TEXTOS SON PROVISORIOS: los revisan especialistas antes de cualquier piloto. Una corrida nunca los pasa a
# "revisado". Los recursos no traen teléfonos ni direcciones inventados: los completa esa revisión (lista curada por país).
fuente: "03 §7.7; D-112"
estado: provisorio
# Lo que dice el NPC cuando se corta una línea (entrada o salida inaceptable): en la ficción, sin regañar (02 §3.2 S4).
linea_segura_en: "Hmm. Let's talk about something else."
# Línea S3 del prompt base (02 §3.2): el NPC la dice tal cual y la escena se detiene.
contencion_en: "Let's stop here for a moment. Lumi will help you now."
# Lo que ve el jugador al entrar en contención: fuera de la ficción, en su idioma, sin preguntas.
contencion_es: "Paramos la escena un momento. Si algo te preocupa o estás en peligro, hablá ahora con un adulto de confianza o con alguien cerca tuyo."
pais_por_defecto: AR
recursos:
  AR:
    etiqueta: "Ayuda en Argentina"
    detalle: "Recurso de ayuda local pendiente de la revisión de especialistas (D-112). Mientras tanto: pedí ayuda a un adulto de confianza o a los servicios de emergencia de tu zona."
