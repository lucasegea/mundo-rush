# Containment and safe line (03 §7.7 points 3-5; GDD DP-38; D-112: mechanism in F4.2, final texts in F13).
# ALL TEXTS ARE PROVISIONAL: specialists review them before any pilot. A run never moves them to
# "revisado". The resources carry no invented phone numbers or addresses: that review completes them (list curated by country).
fuente: "03 §7.7; D-112"
estado: provisorio
# What the NPC says when a line is cut (unacceptable input or output): in the fiction, without scolding (02 §3.2 S4).
linea_segura_en: "Hmm. Let's talk about something else."
# Line S3 of the base prompt (02 §3.2): the NPC says it verbatim and the scene stops.
contencion_en: "Let's stop here for a moment. Lumi will help you now."
# What the player sees on entering containment: outside the fiction, in their language, without questions.
contencion_es: "Paramos la escena un momento. Si algo te preocupa o estás en peligro, hablá ahora con un adulto de confianza o con alguien cerca tuyo."
pais_por_defecto: AR
recursos:
  AR:
    etiqueta: "Ayuda en Argentina"
    detalle: "Recurso de ayuda local pendiente de la revisión de especialistas (D-112). Mientras tanto: pedí ayuda a un adulto de confianza o a los servicios de emergencia de tu zona."
