# Introduction network of the prologue and M1.1-M1.2 (02 §1.7, §4.2, §4.4, §6.2.8; D-168): Inés → Maya → Nell → Ollie → Caleb.
# Inés and Maya (and Kofi) need no introduction: Inés names Maya to you in M0.1 without an edge (02 §4.4 M0.1).
# The alternative paths of 02 §3.1 (Inés → Nell, Kofi → Ollie, Wes → Caleb) have no line in this content:
# they are in presentado_por of each sheet and come in as edges when a phase writes them.
presentaciones:
  - id: INTRO-NELL-MAYA
    npc: NPC-NELL
    presentado_por: NPC-MAYA
    mision: M0.3
    linea_presentador_en: "Nell knows everybody!"
    linea_reconocimiento_en: "Maya told me."
    caminos_alternativos: []
    bicho_de_luz: true
  - id: INTRO-OLLIE-NELL
    npc: NPC-OLLIE
    presentado_por: NPC-NELL
    mision: M1.1
    linea_presentador_en: "Ollie knows every mailbox. Talk to him! Tell him Nell sent you."
    linea_reconocimiento_en: "Nell sent you? Great!"
    caminos_alternativos: []
    bicho_de_luz: true
  - id: INTRO-CALEB-OLLIE
    npc: NPC-CALEB
    presentado_por: NPC-OLLIE
    mision: M1.2
    linea_presentador_en: "Caleb? Big blue mailbox. Tell him Ollie sent you!"
    # Caleb's first line is written with M1.6 (F8).
    linea_reconocimiento_en: null
    caminos_alternativos: []
    bicho_de_luz: true
