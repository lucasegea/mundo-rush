<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunny valley (B)</title>
<style>
  :root {
    --azul: #1F2A44; --blanco: #FFFFFF; --naranja: #FFB020; --naranja-osc: #C77A00; --verde: #3FBF5A; --verde-osc: #23863A;
    --panel: rgba(18, 38, 68, .62); --sombra: 0 4px 0 rgba(0, 0, 0, .18), 0 8px 18px rgba(0, 0, 0, .18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #CFE9FF; color: var(--azul);
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; padding: 16px; }
  .chip { background: var(--panel); color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .badge { position: absolute; top: 16px; right: 16px; }
  .who { position: absolute; top: 16px; left: 16px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE3C2, #E8A774); border: 4px solid #fff; box-shadow: var(--sombra);
    display: grid; place-items: center; font-weight: 900; color: #7A3E12; font-size: 15px; }
  .who .obj { display: flex; flex-direction: column; gap: 4px; }
  .who .obj b { font-size: 15px; }
  .meter { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .meter .title { background: #fff; color: var(--azul); border-radius: 999px; padding: 5px 16px; font-weight: 900; font-size: 15px; box-shadow: var(--sombra); white-space: nowrap; }
  .pips { display: flex; gap: 6px; padding: 6px 10px; background: var(--panel); border-radius: 999px; }
  .pips span { width: 34px; height: 14px; border-radius: 999px; background: rgba(255,255,255,.35); transition: background .3s, transform .3s; }
  .pips span.done { background: linear-gradient(#FFD25C, var(--naranja)); box-shadow: inset 0 -3px 0 var(--naranja-osc); }
  .pips span.now { background: rgba(255, 210, 92, .55); transform: scaleY(1.25); }
  .meter .lbl { font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); font-weight: 700; min-height: 1.2em; }
  .actions { position: absolute; right: 18px; bottom: 18px; display: grid; grid-template-columns: auto auto; gap: 12px; align-items: end; pointer-events: auto; }
  .rbtn { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; background: #2A6FB8; color: #fff; font: 900 12px/1.1 inherit; box-shadow: var(--sombra); cursor: pointer; display: grid; place-items: center; text-align: center; }
  .rbtn.big { width: 96px; height: 96px; font-size: 16px; background: linear-gradient(#FFC94A, var(--naranja)); color: #5A3200; grid-row: span 2; }
  .rbtn.big[aria-disabled="true"] { filter: grayscale(.8) opacity(.6); }
  .rbtn small { display: block; font-size: 11px; opacity: .85; }
  .joy { position: absolute; left: 28px; bottom: 28px; width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,.22); border: 3px solid rgba(255,255,255,.6); display: none; }
  .joy::after { content: ""; position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: var(--sombra); }
  body.touch .joy { display: block; } body.touch .keys { display: none; }
  .keys { position: absolute; left: 16px; bottom: 16px; font-size: 13px; line-height: 1.8; }
  .keys kbd { display: inline-block; min-width: 1.7em; padding: 0 6px; border-radius: 7px; background: #fff; color: var(--azul); border-bottom: 3px solid #9DB3CC; font: 900 12px/1.6 inherit; text-align: center; text-shadow: none; }
  .bubble { position: absolute; left: 50%; top: 118px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); background: #fff; border-radius: 26px; padding: 14px 20px 16px; box-shadow: var(--sombra); pointer-events: auto; }
  .bubble::after { content: ""; position: absolute; left: 62%; bottom: -16px; border: 12px solid transparent; border-top: 16px solid #fff; border-bottom: 0; }
  .bubble .name { font-weight: 900; color: #C23A26; font-size: 15px; }
  .line { font-size: 23px; line-height: 1.3; margin: 4px 0 2px; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-weight: 700; }
  .line .w { background: #FFF0C2; border-radius: 6px; padding: 0 4px; cursor: help; }
  .gloss { font-size: 13px; color: #5B6B82; min-height: 1.2em; font-family: "Segoe UI", system-ui, sans-serif; }

  .turn { display: flex; align-items: center; gap: 8px; background: var(--panel); color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
  .turn .mic { width: 16px; height: 16px; border-radius: 50%; background: #9DB3CC; }

  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(63,191,90,.3); } }
  .pill { border: 0; border-radius: 999px; padding: 10px 16px; background: #fff; color: var(--azul); font: 900 14px inherit; box-shadow: var(--sombra); cursor: pointer; }
  .pill.go { background: linear-gradient(#20803A, #1B6E30); color: #fff; padding: 12px 22px; font-size: 16px; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .tier { position: absolute; right: 16px; top: 56px; font-size: 12px; }
  .hidden { display: none !important; }
  body.talking .actions, body.talking .keys, body.talking .joy, body.talking .who { display: none; }
  @media (max-width: 720px) { .tier { display: none; } .meter { top: 84px; } .bubble { top: 150px; } .keys { display: none; } .line { font-size: 19px; } .pips span { width: 24px; } }

<body class="tier-medio">
<canvas id="scene" aria-label="3D valley: hills, pines, river with bridge, house, corral with horse, Tomás and the player"></canvas>
<div id="hud">

  <div class="keys chip"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Q</kbd> turn camera 45° · <kbd>E</kbd> talk<br><kbd>Shift</kbd> jog · wheel zoom · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> quality · <kbd>Esc</kbd> leave</div>

</div>

<script type="module">
import * as THREE from "three";

// ---------- utilidades ----------
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function hash(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function noise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function sampleCurve(pts, n) { const c = new THREE.CatmullRomCurve3(pts.map(([x, z]) => new THREE.Vector3(x, 0, z))); return c.getSpacedPoints(n).map((p) => [p.x, p.z]); }
function distPoly(poly, x, z) { let best = 1e9; for (let i = 0; i < poly.length - 1; i++) { const [ax, az] = poly[i], [bx, bz] = poly[i + 1]; const dx = bx - ax, dz = bz - az;
  const t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1); const ex = ax + dx * t - x, ez = az + dz * t - z; const d = ex * ex + ez * ez; if (d < best) best = d; } return Math.sqrt(best); }
const col = (h) => new THREE.Color(h);

// ---------- paleta (tokens de la propuesta B) ----------
const P = {
  pasto: "#7CCB4E", pastoLoma: "#A6DC5A", pastoSombra: "#4E9A3A", camino: "#E6C88F", tierra: "#C79A63", orilla: "#E9D9A6",
  pino: "#2E7D4F", pinoLuz: "#4FA36A", copa: "#5DBB45", copaLuz: "#9BDD5E", tronco: "#7A4E2D",
  agua: "#39B6E0", aguaHonda: "#1E86B8", espuma: "#E8FAFF", cenit: "#3E9BFF", horizonte: "#CFEFFF", nube: "#FFFFFF",
  muro: "#FFF4E0", techo: "#E5533D", madera: "#A86B3C", granero: "#C8432F", ventana: "#FFE29A", montania: "#7FA8C9",
};

// ---------- mundo ----------
const RIVER = sampleCurve([[-110, -30], [-60, -20], [-30, -6], [-10, 3], [6, 1], [20, -8], [45, -10], [80, 4], [120, 14]], 260);
const PATH = sampleCurve([[-14, 46], [-8, 26], [-4, 12], [0, 4], [3, -6], [8, -16], [18, -28], [34, -44]], 180);
const dRiver = (x, z) => distPoly(RIVER, x, z);
const dPath = (x, z) => distPoly(PATH, x, z);
function terrainHeight(x, z) {
  const r = Math.hypot(x, z);
  let h = (noise(x * 0.035, z * 0.035) - 0.5) * 5 + (noise(x * 0.09 + 7, z * 0.09) - 0.5) * 1.2;
  h *= smooth(10, 30, r) * 0.85 + 0.15;
  h += smooth(75, 125, r) * 17 * (0.5 + noise(x * 0.02 + 3, z * 0.02));
  h = lerp(h, h * 0.2, 1 - smooth(2, 6, dPath(x, z)));
  h = lerp(h, -1.2, 1 - smooth(2.6, 5.2, dRiver(x, z)));
  return h;
}
let bridge = { x: 0, z: 0, ang: 0 };
{ let best = 1e9; for (let i = 1; i < PATH.length - 1; i++) { const [x, z] = PATH[i]; const d = dRiver(x, z); if (d < best) { best = d; const [ax, az] = PATH[i - 1], [bx, bz] = PATH[i + 1]; bridge = { x, z, ang: Math.atan2(bx - ax, bz - az) }; } } }
const BRIDGE_HALF = 5;
function bridgeLocal(x, z) { const dx = x - bridge.x, dz = z - bridge.z; const s = Math.sin(bridge.ang), c = Math.cos(bridge.ang); return { along: dx * s + dz * c, across: dx * c - dz * s }; }
const onBridge = (x, z) => { const b = bridgeLocal(x, z); return Math.abs(b.along) < BRIDGE_HALF && Math.abs(b.across) < 1.4; };
const bridgeHeight = (a) => 0.25 + 0.6 * Math.cos(clamp(a / BRIDGE_HALF, -1, 1) * Math.PI / 2);
function groundAt(x, z) { if (onBridge(x, z)) return Math.max(terrainHeight(x, z), bridgeHeight(bridgeLocal(x, z).along)); return terrainHeight(x, z); }

// ---------- render ----------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(P.horizonte, 0.0065);
const camera = new THREE.PerspectiveCamera(55, 1, 0.3, 600);

const hemi = new THREE.HemisphereLight(col("#BFE6FF"), col("#6FAE3E"), 1.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(col("#FFF4E0"), 3.0);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.04;
const sc = sun.shadow.camera; sc.left = -26; sc.right = 26; sc.top = 26; sc.bottom = -26; sc.near = 1; sc.far = 140;
scene.add(sun, sun.target);
const SUN_DIR = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 52), THREE.MathUtils.degToRad(28)); // sol a espaldas de la cámara inicial: personajes iluminados de frente

// cielo: degradé cenit-horizonte con halo del sol
{
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uTop: { value: col(P.cenit) }, uHor: { value: col(P.horizonte) }, uSun: { value: SUN_DIR } },
    vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uTop, uHor, uSun; varying vec3 vD; void main(){ float h = clamp(vD.y, 0., 1.); vec3 c = mix(uHor, uTop, pow(h, 0.55));
      float s = max(dot(normalize(vD), normalize(uSun)), 0.); c += vec3(1., .93, .75) * (pow(s, 600.) * 2. + pow(s, 12.) * .18); gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }` });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), m); sky.renderOrder = -1; scene.add(sky);
  scene.userData.sky = sky;
}
// nubes: racimos de esferas blancas suaves
const clouds = new THREE.Group(); {
  const m = new THREE.MeshLambertMaterial({ color: col(P.nube), emissive: col("#DDE8F5"), emissiveIntensity: 0.45, fog: false });
  const g = new THREE.IcosahedronGeometry(1, 3);
  for (let i = 0; i < 16; i++) { const c = new THREE.Group(); const n = 5 + Math.floor(rand() * 4);
    for (let j = 0; j < n; j++) { const s = new THREE.Mesh(g, m); const r = 5 + rand() * 6; s.scale.set(r * 1.4, r * 0.8, r); s.position.set((j - n / 2) * 6 + rand() * 3, rand() * 3, rand() * 5); c.add(s); }
    const a = rand() * Math.PI * 2, d = 160 + rand() * 160; c.position.set(Math.cos(a) * d, 55 + rand() * 45, Math.sin(a) * d); c.lookAt(0, c.position.y, 0); clouds.add(c); }
  scene.add(clouds); }

function paint(geo, hex, { top = 0.15, jitter = 0.05, bottomDark = 0.12, light = null } = {}) {
  const pos = geo.attributes.position; const n = pos.count; const colors = new Float32Array(n * 3); const base = col(hex); const hi = light ? col(light) : base.clone().offsetHSL(0, 0.03, 0.08);
  geo.computeBoundingBox(); const y0 = geo.boundingBox.min.y, y1 = geo.boundingBox.max.y; const tmp = new THREE.Color();
  for (let i = 0; i < n; i++) { const y = (pos.getY(i) - y0) / Math.max(1e-6, y1 - y0); tmp.copy(base).lerp(hi, y * top * 4).multiplyScalar(1 - bottomDark * (1 - y));
    const j = (hash(pos.getX(i) * 13.1, pos.getZ(i) * 7.7 + pos.getY(i) * 3.3) - 0.5) * jitter; tmp.offsetHSL(0, 0, j); colors.set([tmp.r, tmp.g, tmp.b], i * 3); }
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3)); return geo; }
function merge(geos) { const parts = geos.map((g) => (g.index ? g.toNonIndexed() : g)); let n = 0; parts.forEach((g) => (n += g.attributes.position.count));
  const out = new THREE.BufferGeometry(); for (const name of ["position", "normal", "color"]) { const arr = new Float32Array(n * 3).fill(1); let o = 0; parts.forEach((g) => { const a = g.attributes[name]; if (a) arr.set(a.array, o); o += g.attributes.position.count * 3; }); out.setAttribute(name, new THREE.BufferAttribute(arr, 3)); }
  out.computeBoundingSphere(); return out; }
function roundedBox(w, h, d, r, seg = 3) { const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg); const p = g.attributes.position; const v = new THREE.Vector3(), inner = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); inner.set(clamp(v.x, -w / 2 + r, w / 2 - r), clamp(v.y, -h / 2 + r, h / 2 - r), clamp(v.z, -d / 2 + r, d / 2 - r)); v.sub(inner); if (v.lengthSq() > 0) v.setLength(r); v.add(inner); p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g; }
const std = (o = {}) => new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0, ...o });

// ---------- terreno ----------
{
  const SIZE = 260, SEG = 200; const g = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position; const colors = new Float32Array(p.count * 3); const c = new THREE.Color();
  const cP = col(P.pasto), cL = col(P.pastoLoma), cS = col(P.pastoSombra), cC = col(P.camino), cT = col(P.tierra), cO = col(P.orilla), cM = col(P.montania);
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); const h = terrainHeight(x, z); p.setY(i, h); const n1 = noise(x * 0.06, z * 0.06), n2 = noise(x * 0.4, z * 0.4);
    c.copy(cP).lerp(cL, smooth(0.4, 0.85, n1) * 0.7).lerp(cS, smooth(0.6, 0.95, n2) * 0.18); c.lerp(cL, clamp(h / 8, 0, 0.4)); if (h > 14) c.lerp(cM, clamp((h - 14) / 18, 0, 0.6));
    const dp = dPath(x, z) + (n2 - 0.5) * 0.6; if (dp < 2.2) c.lerp(cT, 1 - smooth(1.6, 2.2, dp)); if (dp < 1.7) c.copy(cC);
    const dr = dRiver(x, z); if (dr < 6) c.lerp(cO, 1 - smooth(4.4, 6, dr)); colors.set([c.r, c.g, c.b], i * 3); }
  g.setAttribute("color", new THREE.BufferAttribute(colors, 3)); g.computeVertexNormals();
  const ground = new THREE.Mesh(g, std({ roughness: 0.95 })); ground.receiveShadow = true; scene.add(ground);
}
const waterMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uA: { value: col(P.agua) }, uB: { value: col(P.aguaHonda) }, uH: { value: col(P.espuma) }, uCam: { value: new THREE.Vector3() }, uFog: { value: col(P.horizonte) } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uTime; uniform vec3 uA,uB,uH,uCam,uFog; varying vec3 vW;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    void main(){ vec3 v = normalize(uCam - vW); float fres = pow(1. - max(v.y, 0.), 3.); vec3 c = mix(uB, uA, 0.55 + 0.45 * n(vW.xz * 0.25 + uTime * 0.1));
      c = mix(c, vec3(0.75, 0.9, 1.0), fres * 0.6);
      float s = n(vW.xz * vec2(3.,1.2) + vec2(uTime*0.9, 0.)) * n(vW.xz * vec2(1.1,3.) - vec2(0., uTime*0.7)); c = mix(c, uH, smoothstep(0.55, 0.62, s));
      float d = length(uCam - vW); c = mix(c, uFog, 1. - exp(-pow(d * 0.0065, 2.)));
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }` });
{ const w = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), waterMat); w.rotation.x = -Math.PI / 2; w.position.y = -0.55; scene.add(w); }

// ---------- vegetación ----------
const solids = [];
const COTTAGE = { x: -11, z: 15, w: 6, d: 4.6, rot: 0.3 };
const BARN = { x: 13, z: 9, w: 7, d: 6, rot: -0.5 };
const PADDOCK = { x: 15, z: -2, r: 7 };

function setTier(name) { state.tier = name; const t = TIERS[name]; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, t.dpr)); sun.castShadow = t.shadows; if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } sun.shadow.mapSize.set(t.map, t.map);
  scene.fog.density = t.fog; clouds.visible = t.clouds; scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; }); document.body.classList.remove("tier-bajo", "tier-medio", "tier-alto"); document.body.classList.add(`tier-${name}`); ui.tierName.textContent = ({ bajo: "low", medio: "medium", alto: "high" })[name]; resize(); }
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); setTier("medio");

// ---------- bucle ----------
function blocked(x, z) { if (Math.hypot(x, z) > 60) return true; if (!onBridge(x, z) && terrainHeight(x, z) < -0.45) return true;
  for (const b of [COTTAGE, BARN]) { const lx = x - b.x, lz = z - b.z, c = Math.cos(b.rot), s = Math.sin(b.rot); const rx = lx * c - lz * s, rz = lx * s + lz * c; if (Math.abs(rx) < b.w / 2 + 0.4 && Math.abs(rz) < b.d / 2 + 0.4) return true; }
  const dp = Math.hypot(x - PADDOCK.x, z - PADDOCK.z); if (Math.abs(dp - PADDOCK.r) < 0.5) return true; if (Math.hypot(x - NPC.x, z - NPC.z) < 0.8) return true;
  for (const o of solids) if (Math.hypot(x - o.x, z - o.z) < o.r) return true; return false; }
let elapsed = 0; let lastT = performance.now(); let fpsAcc = 0, fpsN = 0;
const v3 = new THREE.Vector3();
function step(dt) {
  elapsed += dt; const t = elapsed; waterMat.uniforms.uTime.value = t; waterMat.uniforms.uCam.value.copy(camera.position);
  let mx = 0, mz = 0;
  if (state.mode === "explore") { const f = (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0) - (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0); const r = (keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0) - (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0);
    // relativo a la cámara: adelante = hacia donde mira la cámara
    const fx = -Math.sin(cs.yaw), fz = -Math.cos(cs.yaw); mx = fx * f + -fz * r; mz = fz * f + fx * r; }
  let speed = 0;
  if (mx || mz) { const L = Math.hypot(mx, mz); mx /= L; mz /= L; const run = keys.has("ShiftLeft") || keys.has("ShiftRight"); const sp = (run ? 7.5 : 4.2) * dt;
    const nx = player.position.x + mx * sp, nz = player.position.z + mz * sp;
    if (!blocked(nx, nz)) { player.position.x = nx; player.position.z = nz; speed = run ? 1.6 : 1; } else if (!blocked(nx, player.position.z)) { player.position.x = nx; speed = 1; } else if (!blocked(player.position.x, nz)) { player.position.z = nz; speed = 1; }
    const want = Math.atan2(mx, mz); player.rotation.y += wrap(want - player.rotation.y) * alpha(dt, 12);
    // la cámara se acomoda sola detrás del jugador mientras camina (sin mouse)
    if (speed) cs.yaw += wrap(player.rotation.y + Math.PI - cs.yaw) * alpha(dt, CAM.yawRate) * (Math.abs(wrap(player.rotation.y + Math.PI - cs.yaw)) < 2.6 ? 1 : 0); }
  player.position.y = groundAt(player.position.x, player.position.z);
  animate(player, speed, dt, t); animate(tomas, 0, dt, t + 1.1);
  const dx = player.position.x - tomas.position.x, dz = player.position.z - tomas.position.z, dist = Math.hypot(dx, dz);
  state.near = dist < 3.4; ui.talk.setAttribute("aria-disabled", String(!(state.near && state.mode === "explore")));
  if (dist < 7) tomas.rotation.y += wrap(Math.atan2(dx, dz) - tomas.rotation.y) * alpha(dt, 4);
  if (state.mode === "talk") player.rotation.y += wrap(Math.atan2(-dx, -dz) - player.rotation.y) * alpha(dt, 6);
  marker.visible = state.mode === "explore" && state.step < 5; marker.position.set(tomas.position.x, tomas.position.y + 2.75 + Math.sin(t * 3) * 0.1, tomas.position.z); marker.rotation.y = t * 1.5;
  horse.userData.neck.rotation.z = -0.5 + Math.sin(t * 0.7) * 0.35; horse2.userData.neck.rotation.z = Math.sin(t * 0.5 + 2) * 0.2;
  clouds.rotation.y = t * 0.004;
  if (state.mode === "talk") { const L = dist || 1; lumi.position.set(player.position.x - (dz / L) * -1.1 + (dx / L) * 0.4, player.position.y + 2.2 + Math.sin(t * 2) * 0.08, player.position.z + (dx / L) * -1.1 + (dz / L) * 0.4); }
  else lumi.position.set(player.position.x + Math.cos(t * 0.9) * 0.7, player.position.y + 2.35 + Math.sin(t * 2) * 0.1, player.position.z + Math.sin(t * 0.9) * 0.7);
  tickTalk(dt);
  // cámara
  let wantPos, wantLook, wantFov;
  if (state.mode === "talk") { // plano sobre el hombro: el NPC de frente, el jugador de espaldas a un costado
    const L = dist || 1, nx = dx / L, nz = dz / L; const sx = -nz, sz = nx;
    wantPos = v3.set(player.position.x + nx * CAM.talk.back + sx * CAM.talk.side, player.position.y + CAM.talk.height, player.position.z + nz * CAM.talk.back + sz * CAM.talk.side).clone();
    wantLook = new THREE.Vector3((tomas.position.x + player.position.x) / 2 - sx * 0.2, tomas.position.y + 1.6, (tomas.position.z + player.position.z) / 2 - sz * 0.2); wantFov = CAM.talk.fov; }
  else { const d = CAM.zoom[CAM.zoomStep], p = THREE.MathUtils.degToRad(CAM.pitch + CAM.zoomStep * 4);
    wantPos = new THREE.Vector3(player.position.x + Math.sin(cs.yaw) * Math.cos(p) * d, player.position.y + 1.4 + Math.sin(p) * d, player.position.z + Math.cos(cs.yaw) * Math.cos(p) * d);
    const gy = terrainHeight(wantPos.x, wantPos.z) + 0.8; if (wantPos.y < gy) wantPos.y = gy; // no meterse en las lomas
    wantLook = new THREE.Vector3(player.position.x, player.position.y + CAM.lookUp, player.position.z); wantFov = CAM.fov; }
  const a = alpha(dt, state.mode === "talk" ? 3.5 : 6); cs.pos.lerp(wantPos, a); cs.look.lerp(wantLook, a); cs.fov = lerp(cs.fov, wantFov, a);
  camera.position.copy(cs.pos); camera.lookAt(cs.look); if (Math.abs(camera.fov - cs.fov) > 0.01) { camera.fov = cs.fov; camera.updateProjectionMatrix(); }
  sun.position.copy(player.position).addScaledVector(SUN_DIR, 60); sun.target.position.copy(player.position);
  scene.userData.sky.position.copy(camera.position);
}
function frame(now = performance.now()) { const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now; step(dt); renderer.render(scene, camera);
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { ui.fps.textContent = `${Math.round(fpsN / fpsAcc)} fps`; fpsAcc = 0; fpsN = 0; } requestAnimationFrame(frame); }
renderMeter(); for (let i = 0; i < 90; i++) step(1 / 60); requestAnimationFrame(frame);
if (location.hash === "#charla") { player.position.set(NPC.x - 1.8, groundAt(NPC.x - 1.8, NPC.z + 1.6), NPC.z + 1.6); startTalk(); for (let i = 0; i < 240; i++) step(1 / 60); }
window.__estetica = { promptVisible: () => ui.talk.getAttribute("aria-disabled") === "false", state, player, npc: NPC, camera, CAM, step, startTalk, playerDone, endTalk, setTier, teleport: (x, z) => player.position.set(x, groundAt(x, z), z) };
</script>
