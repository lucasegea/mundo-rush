  - id: SAB-METAL-FUGA
    titulo_corto: { es-AR: "La plata que se fuga" }
    linea_en: "The silver did not stay. It crossed the sea to other lands."
    plantilla: null
    linea_sin_dato: "The silver did not stay here."
    explicacion_es: "Galeano describe cómo el metal cruzaba España casi sin tocarla, rumbo a los centros industriales del norte de Europa."
    hechos:
      - id: HV-M1.1-02
        texto_es: "El metal pasaba por España hacia los centros fabriles del norte de Europa."
        fuente_sugerida: "Historia económica del período colonial"
        rama: false
    fuente: "Galeano, Las venas abiertas, cap. «Fiebre del oro, fiebre de la plata», p. 78."
    estado: sin_verificar
    dicho_por: NPC-FACTOR
    mision: M1.1
    rama: false
    ficcion: false
    usable_como_argumento: true
    clasificacion: book_thesis
  - id: SAB-CERRO-RUINA
    titulo_corto: { es-AR: "Esplendor y ruina" }
    linea_en: "First the mountain gave splendor. Then it gave only ruin."
    plantilla: null
    linea_sin_dato: "The mountain gave splendor and then ruin."
    explicacion_es: "El Cerro Rico levantó una ciudad deslumbrante que, agotada la plata, quedó en ruinas: el esplendor y la ruina de Potosí."
    hechos:
      - id: HV-M1.2-01
        texto_es: "Potosí pasó de ciudad deslumbrante a ciudad en ruinas cuando la plata menguó."
        fuente_sugerida: "Crónica histórica de Potosí"
        rama: false
    fuente: "Galeano, Las venas abiertas, cap. «Fiebre del oro, fiebre de la plata», pp. 37 y 50."
    estado: sin_verificar
    dicho_por: NPC-CERRO
    mision: M1.2
    rama: false
    ficcion: false
    usable_como_argumento: true
    clasificacion: book_thesis
  - id: SAB-MITA
    titulo_corto: { es-AR: "La mita" }
    linea_en: "Men were forced into the mountain, shift after shift."
    plantilla: null
    linea_sin_dato: "Men were forced into the mountain to work."
    explicacion_es: "La mita obligaba a los indígenas a trabajar en la mina por turnos; Galeano la cuenta como el costo humano de la plata."
    hechos:
      - id: HV-M1.2-02
        texto_es: "La mita era el sistema de trabajo forzado indígena en las minas de Potosí."
        fuente_sugerida: "Historia colonial andina"
