# Intermedio Galeano — Región R1 (Potosí). book-mode slice-1 / M3 (T3.1).
#
# La INTERPRETACIÓN a mano del libro (docs/research/book-mode/galeano-universe-interpretation.md, Parte 3,
# Acto I / Potosí), ya organizada por campo del contrato del engine. Las etapas INGEST/EXTRACT/DESIGN/LANG-FIT
# son stubs honestos que pasan esto tal cual; EMIT (la única etapa real) lo valida contra @lg/content-schema y
# escribe los YAML canónicos bajo content/universes/U-GALEANO/.
#
# Seam S5 (default headless): 4 figuras, 2 misiones modo-texto. La conversación estratégica del research "C1 —
# Whose cow, whose milk?" se emite como CONV-POTOSI (ConversacionId sólo admite letras: /^CONV-[A-Z]+$/), con
# deduccion_objetivo = SAB-VACA-LECHE (D-803).
#
# M3 SEAM (analizador real): cuando INGEST lea el libro crudo y EXTRACT→LANG-FIT generen este intermedio, esta
# mano-de-obra desaparece; la FORMA (las claves de contrato de abajo) es el límite estable que EMIT ya sabe escribir.

manifiesto:
  id: U-GALEANO
  titulo: "Mundo Rush — Las venas abiertas (Potosí)"
  libro_fuente: "Eduardo Galeano, Las venas abiertas de América Latina (1971)"
  par_idioma: { l1: es-AR, l2: en }

mundo:
