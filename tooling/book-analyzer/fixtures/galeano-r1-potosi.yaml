saberes:
  - id: SAB-VACA-LECHE
    titulo_corto: { es-AR: "La vaca y la leche" }
    linea_en: "Spain had the cow, but other lands drank the milk."
    plantilla: null
    linea_sin_dato: "Spain had the cow, but others drank the milk."
    explicacion_es: "Galeano sostiene que la plata de Potosí no enriqueció a España sino a las potencias que le vendían y le prestaban: tenía la vaca, pero otros tomaban la leche."
    hechos:
      - id: HV-M1.1-01
        texto_es: "La plata americana terminó financiando a banqueros y fabricantes de otras tierras."
        fuente_sugerida: "Ensayo de historia económica latinoamericana"
        rama: false
    fuente: "Galeano, Las venas abiertas, cap. «Fiebre del oro, fiebre de la plata», pp. 40 y 78."
    estado: sin_verificar
    dicho_por: NPC-FACTOR
